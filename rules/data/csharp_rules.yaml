# C# 语言安全规则
# 覆盖 .NET Framework/.NET Core/ASP.NET 常见安全漏洞模式

rules:
  # ==================== RCE / 命令执行 ====================
  - id: csharp-rce-process
    name: C# 命令执行 - Process
    description: 使用 Process 类执行系统命令
    language: csharp
    rule_type: sink
    risk_level: critical
    patterns:
      - Process.Start(
      - ProcessStartInfo(
      - new ProcessStartInfo(
      - process.Start(
      - System.Diagnostics.Process
    cwe_ids:
      - CWE-78
    tags:
      - rce
      - command_injection

  - id: csharp-rce-powershell
    name: C# 命令执行 - PowerShell
    description: 使用 PowerShell 执行命令
    language: csharp
    rule_type: sink
    risk_level: critical
    patterns:
      - PowerShell.Create(
      - AddScript(
      - AddCommand(
      - Invoke(
      - System.Management.Automation
    cwe_ids:
      - CWE-78
    tags:
      - rce
      - powershell

  - id: csharp-rce-codedom
    name: C# 代码执行 - CodeDom
    description: 动态编译和执行代码
    language: csharp
    rule_type: sink
    risk_level: critical
    patterns:
      - CSharpCodeProvider(
      - CompileAssemblyFromSource(
      - CodeDomProvider.CreateProvider(
      - GenerateCodeFromCompileUnit(
    cwe_ids:
      - CWE-94
    tags:
      - rce
      - code_injection

  - id: csharp-rce-reflection
    name: C# 代码执行 - 反射
    description: 使用反射动态调用方法
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - Assembly.Load(
      - Assembly.LoadFrom(
      - Assembly.LoadFile(
      - Activator.CreateInstance(
      - Type.GetType(
      - MethodInfo.Invoke(
      - method.Invoke(
      - type.InvokeMember(
    cwe_ids:
      - CWE-470
    tags:
      - rce
      - reflection

  - id: csharp-rce-expression
    name: C# 表达式执行
    description: 动态表达式编译执行
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - Expression.Compile(
      - DynamicExpression.Parse(
      - CSharpScript.EvaluateAsync(
      - Roslyn.Scripting
    cwe_ids:
      - CWE-94
    tags:
      - rce
      - expression

  # ==================== SQL 注入 ====================
  - id: csharp-sqli-ado
    name: C# SQL 注入 - ADO.NET
    description: 使用 SqlCommand 执行拼接的 SQL
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - SqlCommand(
      - new SqlCommand(
      - command.CommandText
      - SqlDataAdapter(
      - OleDbCommand(
      - OdbcCommand(
      - ExecuteReader(
      - ExecuteNonQuery(
      - ExecuteScalar(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection

  - id: csharp-sqli-ef
    name: C# SQL 注入 - Entity Framework
    description: Entity Framework 原始 SQL 查询
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - FromSqlRaw(
      - ExecuteSqlRaw(
      - FromSqlInterpolated(
      - ExecuteSqlInterpolated(
      - Database.SqlQuery(
      - DbContext.Database.ExecuteSqlCommand(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection
      - entity_framework

  - id: csharp-sqli-dapper
    name: C# SQL 注入 - Dapper
    description: Dapper ORM 查询
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - Query(
      - QueryAsync(
      - QueryFirst(
      - QueryFirstOrDefault(
      - Execute(
      - ExecuteAsync(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection
      - dapper

  # ==================== 文件操作 ====================
  - id: csharp-file-read
    name: C# 任意文件读取
    description: 文件读取操作
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - File.ReadAllText(
      - File.ReadAllBytes(
      - File.ReadAllLines(
      - File.OpenRead(
      - File.Open(
      - FileStream(
      - new FileStream(
      - StreamReader(
      - new StreamReader(
    cwe_ids:
      - CWE-22
    tags:
      - file_read
      - path_traversal

  - id: csharp-file-write
    name: C# 任意文件写入
    description: 文件写入操作
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - File.WriteAllText(
      - File.WriteAllBytes(
      - File.WriteAllLines(
      - File.AppendAllText(
      - File.Create(
      - File.Copy(
      - File.Move(
      - StreamWriter(
      - new StreamWriter(
    cwe_ids:
      - CWE-22
    tags:
      - file_write

  - id: csharp-file-upload
    name: C# 文件上传
    description: ASP.NET 文件上传处理
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - IFormFile
      - SaveAs(
      - CopyTo(
      - CopyToAsync(
      - HttpPostedFile
      - Request.Files
    cwe_ids:
      - CWE-434
    tags:
      - file_upload

  # ==================== 反序列化 ====================
  - id: csharp-deserialize-binary
    name: C# 反序列化 - BinaryFormatter
    description: BinaryFormatter 反序列化不可信数据可能导致 RCE
    language: csharp
    rule_type: sink
    risk_level: critical
    patterns:
      - BinaryFormatter(
      - new BinaryFormatter(
      - binaryFormatter.Deserialize(
      - BinaryFormatter.Deserialize(
    cwe_ids:
      - CWE-502
    tags:
      - deserialization
      - rce

  - id: csharp-deserialize-soap
    name: C# 反序列化 - SoapFormatter
    description: SoapFormatter 反序列化
    language: csharp
    rule_type: sink
    risk_level: critical
    patterns:
      - SoapFormatter(
      - new SoapFormatter(
      - soapFormatter.Deserialize(
    cwe_ids:
      - CWE-502
    tags:
      - deserialization
      - rce

  - id: csharp-deserialize-netdatacontract
    name: C# 反序列化 - NetDataContractSerializer
    description: NetDataContractSerializer 反序列化
    language: csharp
    rule_type: sink
    risk_level: critical
    patterns:
      - NetDataContractSerializer(
      - new NetDataContractSerializer(
      - ReadObject(
    cwe_ids:
      - CWE-502
    tags:
      - deserialization
      - rce

  - id: csharp-deserialize-json
    name: C# 反序列化 - JSON
    description: JSON 反序列化
    language: csharp
    rule_type: sink
    risk_level: high
    patterns:
      - JsonConvert.DeserializeObject(
      - JsonSerializer.Deserialize(
      - JavaScriptSerializer.Deserialize(
