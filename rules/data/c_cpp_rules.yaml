      - path_traversal

  - id: cpp-file-read
    name: C++ 文件读取
    description: 文件读取操作
    language: cpp
    rule_type: sink
    risk_level: high
    patterns:
      - fopen(
      - open(
      - fread(
      - std::ifstream(
      - std::fstream(
      - ifstream.open(
      - ifstream.read(
    cwe_ids:
      - CWE-22
    tags:
      - file_read
      - path_traversal

  - id: c-file-write
    name: C 文件写入
    description: 文件写入操作
    language: c
    rule_type: sink
    risk_level: high
    patterns:
      - fwrite(
      - write(
      - fputs(
      - fputc(
      - putc(
      - putchar(
