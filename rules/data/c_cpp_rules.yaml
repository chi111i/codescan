# C/C++ 语言安全规则
# 覆盖 C/C++ 常见内存安全和安全漏洞模式

rules:
  # ==================== RCE / 命令执行 ====================
  - id: c-rce-system
    name: C 命令执行 - system
    description: 使用 system/popen 执行系统命令
    language: c
    rule_type: sink
    risk_level: critical
    patterns:
      - system(
      - popen(
      - execl(
      - execle(
      - execlp(
      - execv(
      - execve(
      - execvp(
      - fork(
      - vfork(
    cwe_ids:
      - CWE-78
    tags:
      - rce
      - command_injection

  - id: cpp-rce-system
    name: C++ 命令执行 - system
    description: 使用 system/popen 执行系统命令
    language: cpp
    rule_type: sink
    risk_level: critical
    patterns:
      - system(
      - popen(
      - execl(
      - execle(
      - execlp(
      - execv(
      - execve(
      - execvp(
      - fork(
      - std::system(
    cwe_ids:
      - CWE-78
    tags:
      - rce
      - command_injection

  # ==================== 缓冲区溢出 ====================
  - id: c-buffer-overflow-strcpy
    name: C 缓冲区溢出 - strcpy
    description: 使用不安全的字符串复制函数
    language: c
    rule_type: sink
    risk_level: critical
    patterns:
      - strcpy(
      - strcat(
      - sprintf(
      - vsprintf(
      - gets(
      - scanf(
      - sscanf(
      - fscanf(
    cwe_ids:
      - CWE-120
      - CWE-121
      - CWE-122
    tags:
      - buffer_overflow
      - memory_safety

  - id: cpp-buffer-overflow-strcpy
    name: C++ 缓冲区溢出 - strcpy
    description: 使用不安全的字符串复制函数
    language: cpp
    rule_type: sink
    risk_level: critical
    patterns:
      - strcpy(
      - strcat(
      - sprintf(
      - vsprintf(
      - gets(
      - scanf(
      - sscanf(
    cwe_ids:
      - CWE-120
      - CWE-121
    tags:
      - buffer_overflow
      - memory_safety

  - id: c-buffer-overflow-memcpy
    name: C 缓冲区溢出 - memcpy
    description: 内存复制操作可能导致溢出
    language: c
    rule_type: sink
    risk_level: high
    patterns:
      - memcpy(
      - memmove(
      - memset(
      - bcopy(
      - bzero(
    cwe_ids:
      - CWE-120
      - CWE-805
    tags:
      - buffer_overflow
      - memory_safety

  - id: cpp-buffer-overflow-memcpy
    name: C++ 缓冲区溢出 - memcpy
    description: 内存复制操作可能导致溢出
    language: cpp
    rule_type: sink
    risk_level: high
    patterns:
      - memcpy(
      - memmove(
      - memset(
      - std::memcpy(
      - std::memmove(
    cwe_ids:
      - CWE-120
      - CWE-805
    tags:
      - buffer_overflow
      - memory_safety

  # ==================== 格式化字符串 ====================
  - id: c-format-string
    name: C 格式化字符串漏洞
    description: 格式化字符串参数可控
    language: c
    rule_type: sink
    risk_level: critical
    patterns:
      - printf(
      - fprintf(
      - sprintf(
      - snprintf(
      - vprintf(
      - vfprintf(
      - vsprintf(
      - vsnprintf(
      - syslog(
    cwe_ids:
      - CWE-134
    tags:
      - format_string

  - id: cpp-format-string
    name: C++ 格式化字符串漏洞
    description: 格式化字符串参数可控
    language: cpp
    rule_type: sink
    risk_level: critical
    patterns:
      - printf(
      - fprintf(
      - sprintf(
      - snprintf(
      - std::printf(
      - std::fprintf(
    cwe_ids:
      - CWE-134
    tags:
      - format_string

  # ==================== 文件操作 ====================
  - id: c-file-read
    name: C 文件读取
    description: 文件读取操作
