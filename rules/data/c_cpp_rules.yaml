  # ==================== 内存管理 ====================
  - id: c-memory-leak
    name: C 内存泄漏风险
    description: 动态内存分配需要正确释放
    language: c
    rule_type: sink
    risk_level: medium
    patterns:
      - malloc(
      - calloc(
      - realloc(
      - alloca(
      - strdup(
      - strndup(
    cwe_ids:
      - CWE-401
      - CWE-415
      - CWE-416
    tags:
      - memory_leak
      - memory_safety

  - id: cpp-memory-leak
    name: C++ 内存泄漏风险
    description: 动态内存分配需要正确释放
    language: cpp
    rule_type: sink
    risk_level: medium
    patterns:
      - new(
      - new[](
      - malloc(
      - calloc(
      - realloc(
    cwe_ids:
      - CWE-401
      - CWE-415
      - CWE-416
    tags:
      - memory_leak
      - memory_safety

  - id: c-use-after-free
    name: C Use-After-Free 风险
    description: 释放后使用指针
