      - CWE-22
    tags:
      - file_write

  - id: cpp-file-write
    name: C++ 文件写入
    description: 文件写入操作
    language: cpp
    rule_type: sink
    risk_level: high
    patterns:
      - fwrite(
      - write(
      - std::ofstream(
