  - id: cpp-race-condition
    name: C++ 竞态条件
    description: 文件操作存在 TOCTOU 竞态条件
    language: cpp
    rule_type: sink
    risk_level: medium
    patterns:
      - access(
      - stat(
      - std::filesystem::exists(
      - std::filesystem::status(
    cwe_ids:
      - CWE-367
    tags:
      - race_condition
      - toctou

  # ==================== 输入源 (Source) ====================
  - id: c-source-input
    name: C 输入源
    description: C 用户输入源
    language: c
    rule_type: source
    risk_level: info
    patterns:
      - stdin
      - argv
      - argc
      - getenv(
      - fgets(
      - gets(
      - scanf(
      - read(
      - recv(
      - recvfrom(
