  # ==================== 竞态条件 ====================
  - id: c-race-condition
    name: C 竞态条件
    description: 文件操作存在 TOCTOU 竞态条件
    language: c
    rule_type: sink
    risk_level: medium
    patterns:
      - access(
      - stat(
      - lstat(
      - fstat(
