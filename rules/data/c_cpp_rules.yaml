      - use_after_free
      - memory_safety

  - id: cpp-use-after-free
    name: C++ Use-After-Free 风险
    description: 释放后使用指针
    language: cpp
    rule_type: sink
    risk_level: critical
    patterns:
      - delete(
      - delete[](
      - free(
    cwe_ids:
      - CWE-416
    tags:
      - use_after_free
      - memory_safety

