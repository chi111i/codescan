# Ruby 语言安全规则
# 覆盖 Ruby 2.x/3.x 和 Rails 常见安全漏洞模式

rules:
  # ==================== RCE / 命令执行 ====================
  - id: ruby-rce-system
    name: Ruby 命令执行 - system/exec
    description: 使用 system/exec 等函数执行系统命令
    language: ruby
    rule_type: sink
    risk_level: critical
    patterns:
      - system(
      - exec(
      - spawn(
      - fork(
      - syscall(
      - "`"
      - "%x("
      - "%x{"
      - Kernel.system(
      - Kernel.exec(
      - IO.popen(
      - Open3.capture2(
      - Open3.capture3(
      - Open3.popen3(
    cwe_ids:
      - CWE-78
    tags:
      - rce
      - command_injection

  - id: ruby-rce-eval
    name: Ruby 代码执行 - eval
    description: 动态代码执行
    language: ruby
    rule_type: sink
    risk_level: critical
    patterns:
      - eval(
      - instance_eval(
      - class_eval(
      - module_eval(
      - Kernel.eval(
      - binding.eval(
    cwe_ids:
      - CWE-94
    tags:
      - rce
      - code_injection

  - id: ruby-rce-send
    name: Ruby 动态方法调用 - send
    description: 动态方法调用可能导致任意方法执行
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - send(
      - public_send(
      - __send__(
      - method(
      - const_get(
      - constantize(
    cwe_ids:
      - CWE-470
    tags:
      - rce

  # ==================== SQL 注入 ====================
  - id: ruby-sqli-activerecord
    name: Ruby SQL 注入 - ActiveRecord
    description: ActiveRecord 的 where/find_by 拼接 SQL 可能导致注入
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - where(
      - find_by(
      - find_by_sql(
      - select(
      - order(
      - group(
      - having(
      - joins(
      - from(
      - pluck(
      - count(
      - sum(
      - maximum(
      - minimum(
      - average(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection
      - activerecord

  - id: ruby-sqli-raw
    name: Ruby SQL 注入 - 原始查询
    description: 执行原始 SQL 查询
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - execute(
      - exec_query(
      - connection.execute(
      - ActiveRecord::Base.connection.execute(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection

  # ==================== 文件操作 ====================
  - id: ruby-file-read
    name: Ruby 任意文件读取
    description: 文件读取操作
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - File.read(
      - File.open(
      - File.readlines(
      - File.binread(
      - IO.read(
      - IO.readlines(
      - Pathname.new(
      - open(
    cwe_ids:
      - CWE-22
    tags:
      - file_read
      - path_traversal

  - id: ruby-file-write
    name: Ruby 任意文件写入
    description: 文件写入操作
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - File.write(
      - File.binwrite(
      - File.open(
      - IO.write(
      - FileUtils.cp(
      - FileUtils.mv(
      - FileUtils.copy(
    cwe_ids:
      - CWE-22
    tags:
      - file_write

  - id: ruby-file-upload
    name: Ruby 文件上传
    description: 文件上传处理
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - uploaded_file
      - tempfile
      - original_filename
      - content_type
      - CarrierWave
      - ActiveStorage
    cwe_ids:
      - CWE-434
    tags:
      - file_upload

  # ==================== 反序列化 ====================
  - id: ruby-deserialize-marshal
    name: Ruby 反序列化 - Marshal
    description: Marshal 反序列化不可信数据可能导致 RCE
    language: ruby
    rule_type: sink
    risk_level: critical
    patterns:
      - Marshal.load(
      - Marshal.restore(
    cwe_ids:
      - CWE-502
    tags:
      - deserialization
      - rce

  - id: ruby-deserialize-yaml
    name: Ruby 反序列化 - YAML
    description: YAML.load 反序列化可能导致 RCE
    language: ruby
    rule_type: sink
    risk_level: critical
    patterns:
      - YAML.load(
      - Psych.load(
      - YAML.unsafe_load(
    cwe_ids:
      - CWE-502
    tags:
      - deserialization
      - rce

  - id: ruby-deserialize-json
    name: Ruby 反序列化 - JSON
    description: JSON 解析
    language: ruby
    rule_type: sink
    risk_level: medium
    patterns:
      - JSON.parse(
      - JSON.load(
    cwe_ids:
      - CWE-502
    tags:
      - deserialization

  # ==================== SSRF ====================
  - id: ruby-ssrf-http
    name: Ruby SSRF - HTTP 请求
    description: HTTP 请求 URL 可控
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - Net::HTTP.get(
      - Net::HTTP.post(
      - Net::HTTP.start(
      - HTTParty.get(
      - HTTParty.post(
      - Faraday.get(
      - Faraday.post(
      - RestClient.get(
      - RestClient.post(
      - URI.open(
      - open-uri
    cwe_ids:
      - CWE-918
    tags:
      - ssrf

  # ==================== XSS ====================
  - id: ruby-xss-raw
    name: Ruby XSS - raw 输出
    description: Rails raw/html_safe 绕过转义
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - raw(
      - html_safe
      - safe_concat(
      - content_tag(
    cwe_ids:
      - CWE-79
    tags:
      - xss
      - rails

  - id: ruby-xss-erb
    name: Ruby XSS - ERB
    description: ERB 模板可能导致 XSS
    language: ruby
    rule_type: sink
    risk_level: medium
    patterns:
      - "<%="
      - ERB.new(
      - erb.result(
    cwe_ids:
      - CWE-79
    tags:
      - xss
      - erb

  # ==================== 模板注入 ====================
  - id: ruby-ssti-erb
    name: Ruby 模板注入 - ERB
    description: ERB 模板内容可控可能导致 SSTI
    language: ruby
    rule_type: sink
    risk_level: critical
    patterns:
      - ERB.new(
      - erb.result(
      - Erubi::Engine.new(
    cwe_ids:
      - CWE-94
    tags:
      - ssti
      - erb

  # ==================== 开放重定向 ====================
  - id: ruby-open-redirect
    name: Ruby 开放重定向
    description: 重定向目标可控
    language: ruby
    rule_type: sink
    risk_level: medium
    patterns:
      - redirect_to(
      - redirect_back(
    cwe_ids:
      - CWE-601
    tags:
      - open_redirect
      - rails

  # ==================== 加密相关 ====================
  - id: ruby-weak-crypto
    name: Ruby 弱加密算法
    description: 使用弱加密算法
    language: ruby
    rule_type: sink
    risk_level: medium
    patterns:
      - Digest::MD5
      - Digest::SHA1
      - OpenSSL::Cipher::DES
    cwe_ids:
      - CWE-327
    tags:
      - weak_crypto

  - id: ruby-weak-random
    name: Ruby 弱随机数
    description: 使用不安全的随机数
    language: ruby
    rule_type: sink
    risk_level: medium
    patterns:
      - rand(
      - Random.new(
      - srand(
    cwe_ids:
      - CWE-330
    tags:
      - weak_random

  # ==================== 硬编码凭据 ====================
  - id: ruby-hardcoded-credentials
    name: Ruby 硬编码凭据
    description: 代码中硬编码密码/密钥
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - prefix:password
      - prefix:secret
      - prefix:api_key
      - prefix:token
    cwe_ids:
      - CWE-798
    tags:
      - hardcoded_credentials

  # ==================== 正则表达式 DoS ====================
  - id: ruby-redos
    name: Ruby ReDoS
    description: 正则表达式可能导致 ReDoS
    language: ruby
    rule_type: sink
    risk_level: medium
    patterns:
      - Regexp.new(
      - =~
      - match(
      - scan(
      - gsub(
      - sub(
    cwe_ids:
      - CWE-1333
    tags:
      - redos
      - dos

  # ==================== 日志注入 ====================
  - id: ruby-log-injection
    name: Ruby 日志注入
    description: 用户输入直接写入日志
    language: ruby
    rule_type: sink
    risk_level: low
    patterns:
      - Rails.logger.info(
      - Rails.logger.debug(
      - Rails.logger.error(
      - Rails.logger.warn(
      - logger.info(
      - logger.debug(
      - logger.error(
    cwe_ids:
      - CWE-117
    tags:
      - log_injection

  # ==================== 输入源 (Source) ====================
  - id: ruby-source-params
    name: Ruby Rails 请求参数
    description: Rails 请求参数
    language: ruby
    rule_type: source
    risk_level: info
    patterns:
      - params[
      - params.permit(
      - params.require(
      - request.params
      - request.query_parameters
      - request.request_parameters
    tags:
      - source
      - rails

  - id: ruby-source-request
    name: Ruby 请求对象
    description: 请求对象属性
    language: ruby
    rule_type: source
    risk_level: info
    patterns:
      - request.body
      - request.headers
      - request.cookies
      - request.raw_post
      - request.url
      - request.path
    tags:
      - source

  - id: ruby-source-env
    name: Ruby 环境变量
    description: 环境变量
    language: ruby
    rule_type: source
    risk_level: info
    patterns:
      - ENV[
      - ENV.fetch(
    tags:
      - source
      - environment

  # ==================== 清理函数 (Sanitizer) ====================
  - id: ruby-sanitizer-escape
    name: Ruby 转义函数
    description: HTML 转义函数
    language: ruby
    rule_type: sanitizer
    risk_level: info
    patterns:
      - h(
      - html_escape(
      - ERB::Util.html_escape(
      - CGI.escapeHTML(
      - sanitize(
      - strip_tags(
    tags:
      - sanitizer
      - escape

  # ==================== 认证/授权 ====================
  - id: ruby-auth-session
    name: Ruby Session 处理
    description: Session 操作
    language: ruby
    rule_type: sink
    risk_level: medium
    patterns:
      - session[
      - cookies[
      - reset_session
    cwe_ids:
      - CWE-384
    tags:
      - authentication
      - session

  - id: ruby-auth-devise
    name: Ruby Devise 认证
    description: Devise 认证相关
    language: ruby
    rule_type: sink
    risk_level: medium
    patterns:
      - authenticate_user!
      - current_user
      - user_signed_in?
      - sign_in(
      - sign_out(
    cwe_ids:
      - CWE-287
    tags:
      - authentication
      - devise

  # ==================== Mass Assignment ====================
  - id: ruby-mass-assignment
    name: Ruby Mass Assignment
    description: 批量赋值可能导致越权
    language: ruby
    rule_type: sink
    risk_level: high
    patterns:
      - update_attributes(
      - update(
      - create(
      - new(
      - assign_attributes(
      - attributes=(
    cwe_ids:
      - CWE-915
    tags:
      - mass_assignment
      - rails
