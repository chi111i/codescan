# =============================================================================
# CodeScan 业务逻辑场景规则 - 优化版
# =============================================================================
# 版本: 2.0.0
# 用途: 检测业务逻辑漏洞，LLM 深度分析的上下文引导
# =============================================================================

_metadata:
  version: "2.0.0"
  last_updated: "2025-12-25"
  description: |
    业务逻辑场景规则，用于：
    1. 识别敏感业务场景（资金、认证、权限）
    2. 提供场景特定的检查清单
    3. 生成 LLM 分析的上下文提示

# =============================================================================
# 场景分类定义
# =============================================================================
categories:
  financial:
    name: 资金/交易
    risk_level: critical
    description: 涉及资金流转、支付、余额操作的功能

  authentication:
    name: 认证相关
    risk_level: critical
    description: 登录、注册、密码重置、账户绑定等

  authorization:
    name: 权限控制
    risk_level: high
    description: 资源访问控制、角色管理、权限分配

  data_operation:
    name: 数据操作
    risk_level: high
    description: 数据的增删改查，特别是批量操作

# =============================================================================
# 业务场景规则
# =============================================================================
scenarios:

  # ---------------------------------------------------------------------------
  # 资金/交易场景
  # ---------------------------------------------------------------------------

  - id: BIZ-TRANSFER
    name: 余额转账/资金划转
    category: financial
    risk_level: critical

    identification:
      keywords:
        - transfer
        - withdraw
        - deposit
        - balance
        - wallet
        - remittance
        - 转账
        - 提现
        - 充值
        - 汇款
        - 余额
      function_patterns:
        - "regex:transfer.*balance"
        - "regex:send.*money"
        - "regex:withdraw.*fund"
        - "regex:update.*balance"
      parameter_indicators:
        - source_user|from_user|sender|from_account
        - target_user|to_user|receiver|to_account
        - amount|money|value|sum|balance

    security_checklist:
      - id: TRF-001
        check: 账户所有权验证
        description: 转出账户必须属于当前登录用户
        severity: critical
        positive_patterns:
          - "current_user.*==.*source"
          - "request.user.*source"
          - "session.user_id.*==.*from"
        negative_patterns:
          - "source.*=.*request.body"
          - "from_user.*=.*params"

      - id: TRF-002
        check: 金额服务端验证
        description: 金额必须为正数，服务端重新校验
        severity: critical
        positive_patterns:
          - "amount.*>.*0"
          - "validate.*amount"
          - "check.*positive"
        negative_patterns:
          - "amount.*=.*request"

      - id: TRF-003
        check: 余额充足性检查
        description: 扣款前验证余额充足
        severity: critical
        positive_patterns:
          - "balance.*>=.*amount"
          - "check.*sufficient"
          - "if.*balance.*<.*amount"

      - id: TRF-004
        check: 事务原子性
        description: 转账操作必须在事务中完成
        severity: high
        positive_patterns:
          - "@transaction"
          - "with.*transaction"
          - "BEGIN.*COMMIT"
          - "atomic"

      - id: TRF-005
        check: 并发控制
        description: 使用锁或乐观锁防止并发问题
        severity: high
        positive_patterns:
          - "FOR UPDATE"
          - "select_for_update"
          - "lock"
          - "version.*check"

      - id: TRF-006
        check: 操作审计
        description: 记录完整的转账日志
        severity: medium
        positive_patterns:
          - "audit"
          - "log.*transfer"
          - "record.*transaction"

    llm_prompt: |
      你正在审计一个**资金转账功能**。请严格检查以下安全问题：

      ## 关键检查点
      1. **账户所有权**: 转出账户是否验证属于当前用户？能否通过修改参数转走他人资金？
      2. **金额安全**: 金额是否在服务端验证？能否传入负数/零值/超大数？
      3. **余额检查**: 扣款前是否验证余额？检查和扣款是否在同一事务中？
      4. **并发安全**: 是否有锁机制防止并发超额转账（TOCTOU）？
      5. **审计追踪**: 是否记录了完整的操作日志？

      ## 典型攻击场景
      - 修改 from_account 参数转走他人资金 (IDOR)
      - 传入负数金额实现反向转账
      - 并发请求导致余额透支
      - 绕过验证直接调用内部转账方法

      请分析代码并指出具体的漏洞位置、攻击方式和修复建议。

  - id: BIZ-PAYMENT-CALLBACK
    name: 支付回调处理
    category: financial
    risk_level: critical

    identification:
      keywords:
        - callback
        - notify
        - webhook
        - payment.*result
        - 回调
        - 通知
        - 支付结果
      function_patterns:
        - "regex:payment.*callback"
        - "regex:pay.*notify"
        - "regex:order.*callback"
        - "regex:alipay.*notify"
        - "regex:wechat.*notify"
      decorator_indicators:
        - "@.*webhook"
        - "@.*callback"

    security_checklist:
      - id: PAY-001
        check: 签名验证
        description: 必须验证支付平台的签名
        severity: critical
        positive_patterns:
          - "verify.*sign"
          - "check.*signature"
          - "validate.*hmac"

      - id: PAY-002
        check: 金额核对
        description: 回调金额必须与订单金额一致
        severity: critical
        positive_patterns:
          - "callback.*amount.*==.*order.*amount"
          - "verify.*amount"

      - id: PAY-003
        check: 订单状态检查
        description: 处理前检查订单状态，防止重复处理
        severity: critical
        positive_patterns:
          - "order.status.*PENDING"
          - "if.*paid.*return"

      - id: PAY-004
        check: 幂等性
        description: 同一回调多次请求只处理一次
        severity: high
        positive_patterns:
          - "idempotent"
          - "processed.*return"

    llm_prompt: |
      你正在审计一个**支付回调处理**函数。请检查：

      ## 关键检查点
      1. **签名验证**: 是否验证了支付平台签名？签名算法是否正确？
      2. **金额核对**: 回调金额是否与订单原始金额比对？
      3. **状态检查**: 是否检查订单当前状态？能否重复触发？
      4. **幂等处理**: 多次相同回调是否会重复发货/充值？

      ## 典型攻击场景
      - 伪造支付成功回调（无签名验证）
      - 篡改金额（支付 1 元购买 100 元商品）
      - 重放攻击（重复使用成功回调）
      - 订单替换（支付成功后篡改订单内容）

  - id: BIZ-ORDER
    name: 订单操作
    category: financial
    risk_level: high

    identification:
      keywords:
        - order
        - checkout
        - cart
        - purchase
        - 订单
        - 结算
        - 购物车
      function_patterns:
        - "regex:create.*order"
        - "regex:place.*order"
        - "regex:update.*order"
        - "regex:cancel.*order"
      parameter_indicators:
        - order_id|orderId
        - price|amount|total
        - quantity|qty|count
        - discount|coupon

    security_checklist:
      - id: ORD-001
        check: 价格服务端获取
        description: 商品价格必须从数据库获取，不能信任客户端
        severity: critical
        positive_patterns:
          - "product.price"
          - "get.*price.*db"

      - id: ORD-002
        check: 数量验证
        description: 数量必须为正整数，有上下限
        severity: high
        positive_patterns:
          - "quantity.*>.*0"
          - "max.*quantity"

      - id: ORD-003
        check: 优惠验证
        description: 优惠券有效性、使用次数、适用范围
        severity: high
        positive_patterns:
          - "coupon.*valid"
          - "check.*coupon"

      - id: ORD-004
        check: 订单归属
        description: 修改/取消订单时验证归属
        severity: critical
        positive_patterns:
          - "order.user.*==.*current"

    llm_prompt: |
      你正在审计**订单操作**功能。请检查：

      ## 关键检查点
      1. **价格篡改**: 商品价格从哪里获取？能否在下单时篡改价格？
      2. **数量篡改**: 数量是否有范围限制？能否传入负数？
      3. **优惠滥用**: 优惠券能否重复使用？跨店使用？
      4. **订单归属**: 操作订单时是否验证归属当前用户？
      5. **状态流转**: 订单状态变更是否合法？

  # ---------------------------------------------------------------------------
  # 认证相关场景
  # ---------------------------------------------------------------------------

  - id: BIZ-PASSWORD-RESET
    name: 密码重置
    category: authentication
    risk_level: critical

    identification:
      keywords:
        - password.*reset
        - forgot.*password
        - reset.*token
        - 重置密码
        - 找回密码
        - 忘记密码
      function_patterns:
        - "regex:reset.*password"
        - "regex:forgot.*password"
        - "regex:send.*reset"

    security_checklist:
      - id: RST-001
        check: Token 随机性
        description: 使用密码学安全的随机数生成 Token
        severity: critical
        positive_patterns:
          - "secrets.token"
          - "crypto.randomBytes"
          - "uuid4"

      - id: RST-002
        check: Token 有效期
        description: Token 必须有合理的过期时间（建议 < 1 小时）
        severity: high
        positive_patterns:
          - "expire"
          - "valid_until"
          - "ttl"

      - id: RST-003
        check: Token 单次使用
        description: Token 使用后立即失效
        severity: critical
        positive_patterns:
          - "delete.*token"
          - "invalidate"
          - "used.*=.*True"

      - id: RST-004
        check: 频率限制
        description: 限制重置请求频率
        severity: high
        positive_patterns:
          - "rate_limit"
          - "throttle"
          - "cooldown"

      - id: RST-005
        check: 用户枚举防护
        description: 无论用户是否存在返回相同响应
        severity: medium
        positive_patterns:
          - "generic.*message"

    llm_prompt: |
      你正在审计**密码重置**功能。请检查：

      ## 关键检查点
      1. **Token 安全性**: Token 是否使用安全随机数？长度是否足够？
      2. **Token 有效期**: 过期时间是否合理？
      3. **一次性使用**: Token 使用后是否立即失效？
      4. **用户枚举**: 能否通过响应差异判断用户是否存在？
      5. **频率限制**: 是否限制重置请求频率？

      ## 典型攻击场景
      - Token 可预测导致任意用户密码重置
      - Token 长期有效或可重复使用
      - 通过响应差异枚举有效用户
      - 暴力破解 Token

  - id: BIZ-ACCOUNT-BINDING
    name: 账户绑定变更
    category: authentication
    risk_level: critical

    identification:
      keywords:
        - bind.*email
        - bind.*phone
        - change.*email
        - change.*phone
        - unbind
        - 绑定
        - 换绑
        - 解绑
      function_patterns:
        - "regex:bind.*email"
        - "regex:update.*phone"
        - "regex:link.*account"

    security_checklist:
      - id: BND-001
        check: 原凭证验证
        description: 变更前验证当前密码或原手机验证码
        severity: critical
        positive_patterns:
          - "verify.*old"
          - "check.*password"
          - "current.*code"

      - id: BND-002
        check: 新凭证验证
        description: 验证新邮箱/手机的所有权
        severity: critical
        positive_patterns:
          - "verify.*new"
          - "send.*code"
          - "confirm"

      - id: BND-003
        check: 验证码安全
        description: 验证码有效期、长度、尝试次数限制
        severity: high
        positive_patterns:
          - "code.*expire"
          - "max.*attempts"

    llm_prompt: |
      你正在审计**账户绑定变更**功能。请检查：

      ## 关键检查点
      1. **原凭证验证**: 变更前是否验证了密码或原验证码？
      2. **新凭证验证**: 是否验证了新邮箱/手机的所有权？
      3. **验证码安全**: 验证码是否有有效期？尝试次数限制？
      4. **操作通知**: 是否通知了原邮箱/手机？

      ## 典型攻击场景
      - 未验证原凭证，任意绑定新邮箱/手机
      - 验证码可暴力破解
      - 利用条件竞争绕过验证
      - 验证码发送轰炸

  - id: BIZ-LOGIN
    name: 登录认证
    category: authentication
    risk_level: high

    identification:
      keywords:
        - login
        - signin
        - authenticate
        - 登录
        - 登陆
      function_patterns:
        - "regex:login"
        - "regex:signin"
        - "regex:authenticate"

    security_checklist:
      - id: LGN-001
        check: 密码安全比较
        description: 使用恒定时间比较防止时序攻击
        severity: high
        positive_patterns:
          - "compare_digest"
          - "constant_time"
          - "bcrypt.check"

      - id: LGN-002
        check: 登录失败限制
        description: 限制登录失败次数，防止暴力破解
        severity: high
        positive_patterns:
          - "max.*attempts"
          - "lock.*account"
          - "rate_limit"

      - id: LGN-003
        check: 会话安全
        description: 登录成功后重新生成会话 ID
        severity: high
        positive_patterns:
          - "regenerate.*session"
          - "new.*session"

      - id: LGN-004
        check: 安全日志
        description: 记录登录尝试（成功和失败）
        severity: medium
        positive_patterns:
          - "log.*login"
          - "audit"

    llm_prompt: |
      你正在审计**登录认证**功能。请检查：

      ## 关键检查点
      1. **密码比较**: 是否使用恒定时间比较？
      2. **暴力破解防护**: 是否限制登录失败次数？
      3. **会话安全**: 登录后是否重新生成会话 ID？
      4. **二次验证**: 敏感账户是否支持 2FA？
      5. **日志记录**: 是否记录登录尝试？

  # ---------------------------------------------------------------------------
  # 权限控制场景
  # ---------------------------------------------------------------------------

  - id: BIZ-RESOURCE-ACCESS
    name: 资源访问控制
    category: authorization
    risk_level: high

    identification:
      keywords:
        - get.*by.*id
        - find.*by.*id
        - delete
        - update
        - edit
      function_patterns:
        - "regex:get.*by.*id"
        - "regex:delete.*"
        - "regex:update.*"
      parameter_indicators:
        - id
        - user_id|userId
        - resource_id

    security_checklist:
      - id: ACC-001
        check: 资源所有权验证
        description: 验证资源属于当前用户
        severity: critical
        positive_patterns:
          - "resource.user.*==.*current"
          - "belongs_to"
          - "owner.*==.*request.user"

      - id: ACC-002
        check: 租户隔离
        description: 多租户系统验证租户边界
        severity: critical
        positive_patterns:
          - "tenant_id.*=="
          - "organization.*=="

      - id: ACC-003
        check: 列表接口过滤
        description: 列表只返回当前用户有权访问的数据
        severity: high
        positive_patterns:
          - "filter.*user"
          - "where.*user_id"

    llm_prompt: |
      你正在审计**资源访问控制**。请检查：

      ## 关键检查点
      1. **IDOR 漏洞**: 是否验证资源属于当前用户？能否通过修改 ID 访问他人数据？
      2. **租户隔离**: 多租户系统是否正确隔离数据？
      3. **批量操作**: 批量操作时是否验证每个资源的权限？
      4. **列表泄露**: 列表接口是否可能泄露其他用户数据？

      ## 典型攻击场景
      - 修改 URL/参数中的 ID 访问他人数据 (IDOR)
      - 批量操作时混入他人资源 ID
      - 通过搜索/过滤接口枚举数据

  - id: BIZ-ADMIN
    name: 管理员操作
    category: authorization
    risk_level: critical

    identification:
      keywords:
        - admin
        - manage
        - backend
        - dashboard
        - 管理
        - 后台
      function_patterns:
        - "regex:admin.*"
        - "regex:manage.*"
      decorator_indicators:
        - "@admin_required"
        - "@staff_required"
        - "@permission_required"

    security_checklist:
      - id: ADM-001
        check: 权限验证
        description: 验证管理员权限
        severity: critical
        positive_patterns:
          - "is_admin"
          - "is_staff"
          - "@admin_required"

      - id: ADM-002
        check: 操作审计
        description: 记录管理操作日志
        severity: high
        positive_patterns:
          - "audit_log"
          - "admin_log"

      - id: ADM-003
        check: 二次验证
        description: 高危操作需要二次确认
        severity: high
        positive_patterns:
          - "confirm.*password"
          - "verify.*otp"
          - "two_factor"

    llm_prompt: |
      你正在审计**管理员操作**接口。请检查：

      ## 关键检查点
      1. **权限验证**: 是否验证管理员身份？能否绕过？
      2. **权限粒度**: 不同级别管理员权限是否区分？
      3. **操作审计**: 敏感操作是否记录日志？
      4. **二次验证**: 高危操作是否需要确认？
      5. **越权风险**: 低权限管理员能否执行高权限操作？

  # ---------------------------------------------------------------------------
  # 数据操作场景
  # ---------------------------------------------------------------------------

  - id: BIZ-EXPORT
    name: 数据导出
    category: data_operation
    risk_level: high

    identification:
      keywords:
        - export
        - download
        - dump
        - 导出
        - 下载
        - 备份
      function_patterns:
        - "regex:export.*"
        - "regex:download.*"

    security_checklist:
      - id: EXP-001
        check: 数据范围限制
        description: 只导出当前用户有权访问的数据
        severity: critical
        positive_patterns:
          - "filter.*user"
          - "permission.*check"

      - id: EXP-002
        check: 数据脱敏
        description: 敏感字段脱敏处理
        severity: high
        positive_patterns:
          - "mask"
          - "desensitize"
          - "anonymize"

      - id: EXP-003
        check: 频率限制
        description: 限制导出频率防止大规模抓取
        severity: medium
        positive_patterns:
          - "rate_limit"
          - "throttle"

    llm_prompt: |
      你正在审计**数据导出**功能。请检查：

      ## 关键检查点
      1. **权限验证**: 只能导出当前用户有权访问的数据？
      2. **数据范围**: 导出范围是否可被篡改？
      3. **敏感数据**: 敏感字段是否脱敏？
      4. **频率限制**: 是否防止批量抓取？
      5. **审计日志**: 是否记录导出操作？

  - id: BIZ-IMPORT
    name: 数据导入
    category: data_operation
    risk_level: high

    identification:
      keywords:
        - import
        - upload
        - batch
        - 导入
        - 上传
        - 批量
      function_patterns:
        - "regex:import.*"
        - "regex:batch.*"

    security_checklist:
      - id: IMP-001
        check: 文件类型验证
        description: 验证上传文件类型
        severity: high
        positive_patterns:
          - "validate.*file"
          - "check.*extension"
          - "mime.*type"

      - id: IMP-002
        check: 文件大小限制
        description: 限制上传文件大小
        severity: medium
        positive_patterns:
          - "max.*size"
          - "size.*limit"

      - id: IMP-003
        check: 数据验证
        description: 验证导入数据的合法性
        severity: high
        positive_patterns:
          - "validate"
          - "schema"

    llm_prompt: |
      你正在审计**数据导入**功能。请检查：

      ## 关键检查点
      1. **文件安全**: 是否验证文件类型和大小？
      2. **数据验证**: 导入数据是否经过验证？
      3. **权限控制**: 是否只能导入到有权限的范围？
      4. **覆盖风险**: 导入是否会覆盖现有数据？
      5. **恶意内容**: CSV 注入、XXE 等风险？

# =============================================================================
# 通用检查规则（适用于所有场景）
# =============================================================================
common_checks:

  - id: COM-AUTH
    name: 身份认证
    description: 接口是否需要登录
    positive_patterns:
      - "@login_required"
      - "@authenticated"
      - "jwt.*verify"
      - "session.*user"

  - id: COM-INPUT
    name: 输入验证
    description: 用户输入是否经过验证
    positive_patterns:
      - "validate"
      - "sanitize"
      - "Schema"
      - "Serializer"

  - id: COM-ERROR
    name: 错误处理
    description: 错误信息是否泄露敏感数据
    negative_patterns:
      - "return.*str(e)"
      - "return.*exception"
      - "traceback"

  - id: COM-LOG
    name: 日志记录
    description: 敏感操作是否记录日志
    positive_patterns:
      - "logger"
      - "logging"
      - "audit"

# =============================================================================
# 配置参数
# =============================================================================
config:
  severity_weights:
    critical: 1.0
    high: 0.8
    medium: 0.5
    low: 0.2

  matching_thresholds:
    keyword_match_ratio: 0.3
    pattern_match_count: 2
    confidence_threshold: 0.6
