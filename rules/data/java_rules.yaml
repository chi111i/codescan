    language: java
    rule_type: source
    risk_level: info
    patterns:
      - request.getParameter(
      - request.getParameterValues(
      - request.getParameterMap(
      - request.getHeader(
      - request.getCookies(
      - request.getInputStream(
      - request.getReader(
      - HttpServletRequest.getParameter(
    tags:
      - source
      - servlet

  - id: java-source-spring-request
