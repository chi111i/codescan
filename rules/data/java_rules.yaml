# Java 语言安全规则
# 覆盖 Java 8+ 常见安全漏洞模式

rules:
  # ==================== RCE / 命令执行 ====================
  - id: java-rce-runtime-exec
    name: Java 命令执行 - Runtime.exec
    description: 使用 Runtime.exec 执行系统命令
    language: java
    rule_type: sink
    risk_level: critical
    patterns:
      - Runtime.getRuntime().exec(
      - Runtime.exec(
      - getRuntime().exec(
    cwe_ids:
      - CWE-78
    tags:
      - rce
      - command_injection

  - id: java-rce-processbuilder
    name: Java 命令执行 - ProcessBuilder
    description: 使用 ProcessBuilder 执行系统命令
    language: java
    rule_type: sink
    risk_level: critical
    patterns:
      - ProcessBuilder(
      - new ProcessBuilder(
      - processBuilder.command(
      - processBuilder.start(
    cwe_ids:
      - CWE-78
    tags:
      - rce
      - command_injection

  - id: java-rce-script-engine
    name: Java 代码执行 - ScriptEngine
    description: 使用 ScriptEngine 执行脚本代码
    language: java
    rule_type: sink
    risk_level: critical
    patterns:
      - ScriptEngine.eval(
      - scriptEngine.eval(
      - engine.eval(
      - ScriptEngineManager(
    cwe_ids:
      - CWE-94
    tags:
      - rce
      - code_injection

  - id: java-rce-expression-language
    name: Java 表达式注入 - EL/OGNL/SpEL
    description: 表达式语言注入可能导致 RCE
    language: java
    rule_type: sink
    risk_level: critical
    patterns:
      - ELProcessor.eval(
      - ValueExpression.getValue(
      - Ognl.getValue(
      - OgnlUtil.getValue(
      - SpelExpressionParser(
      - StandardEvaluationContext(
      - parseExpression(
      - expression.getValue(
    cwe_ids:
      - CWE-917
    tags:
      - rce
      - expression_injection
      - ognl
      - spel

  # ==================== SQL 注入 ====================
  - id: java-sqli-statement
    name: Java SQL 注入 - Statement
    description: 使用 Statement 执行拼接的 SQL 语句
    language: java
    rule_type: sink
    risk_level: high
    patterns:
      - Statement.execute(
      - Statement.executeQuery(
      - Statement.executeUpdate(
      - statement.execute(
      - statement.executeQuery(
      - statement.executeUpdate(
      - createStatement(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection

  - id: java-sqli-hibernate
    name: Java SQL 注入 - Hibernate
    description: Hibernate 的 createQuery/createSQLQuery 可能导致 SQL 注入
    language: java
    rule_type: sink
    risk_level: high
    patterns:
      - createQuery(
      - createSQLQuery(
      - createNativeQuery(
      - session.createQuery(
      - entityManager.createQuery(
      - entityManager.createNativeQuery(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection
      - hibernate

  - id: java-sqli-mybatis
    name: Java SQL 注入 - MyBatis
    description: MyBatis 的 ${} 占位符可能导致 SQL 注入
    language: java
    rule_type: sink
    risk_level: high
    patterns:
      - '"${"'
      - '"${}"'
      - selectList(
      - selectOne(
      - insert(
      - update(
      - delete(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection
      - mybatis

  - id: java-sqli-spring-jdbc
    name: Java SQL 注入 - Spring JDBC
    description: Spring JdbcTemplate 的 query/update 方法
    language: java
    rule_type: sink
    risk_level: high
    patterns:
      - jdbcTemplate.query(
      - jdbcTemplate.queryForObject(
      - jdbcTemplate.queryForList(
      - jdbcTemplate.update(
      - jdbcTemplate.execute(
      - JdbcTemplate.query(
      - JdbcTemplate.update(
    cwe_ids:
      - CWE-89
    tags:
      - sql_injection
      - spring

  # ==================== 文件操作 ====================
  - id: java-file-read
    name: Java 任意文件读取
    description: 文件读取操作，路径可控可能导致任意文件读取
    language: java
    rule_type: sink
    risk_level: high
    patterns:
      - FileInputStream(
      - FileReader(
      - Files.readAllBytes(
      - Files.readAllLines(
      - Files.readString(
      - Files.newInputStream(
      - BufferedReader(
      - new File(
      - Paths.get(
    cwe_ids:
      - CWE-22
      - CWE-73
    tags:
      - file_read
      - path_traversal

  - id: java-file-write
    name: Java 任意文件写入
    description: 文件写入操作，路径可控可能导致任意文件写入
    language: java
    rule_type: sink
    risk_level: high
    patterns:
      - FileOutputStream(
      - FileWriter(
      - Files.write(
      - Files.writeString(
      - Files.copy(
      - Files.move(
      - BufferedWriter(
      - PrintWriter(
    cwe_ids:
      - CWE-22
      - CWE-73
    tags:
      - file_write

  - id: java-file-upload
    name: Java 文件上传
    description: 文件上传处理不当可能导致任意文件上传
    language: java
    rule_type: sink
    risk_level: high
    patterns:
      - MultipartFile.transferTo(
      - Part.write(
      - getInputStream(
      - getOriginalFilename(
    cwe_ids:
      - CWE-434
    tags:
      - file_upload

