      - "PROTOCOL_TLSv1"
      - "PROTOCOL_TLSv1_1"
      - "CERT_NONE"
      - "verify=False"
      - "verify_ssl=False"
    description: |
      SSLv2/v3/TLSv1.0/1.1 已不安全，存在已知漏洞。
      禁用证书验证会导致中间人攻击。
    fix_suggestion: |
      1. 使用 TLSv1.2 或更高版本
      2. 始终验证服务器证书
      3. 不要设置 verify=False
    cwe_ids: ["CWE-295", "CWE-327"]
