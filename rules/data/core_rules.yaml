  # ===========================================================================
  # 第九部分: 弱加密/随机数 - Medium
  # ===========================================================================

  - id: py-crypto-weak-hash
    name: 弱哈希算法
    rule_type: pattern
    category: crypto
    risk_level: medium
    languages: [python]
    patterns:
      - hashlib.md5
      - hashlib.sha1
      - MD5.new
      - SHA.new
      - "regex:hmac\\.new\\(.*md5"
      - "regex:hmac\\.new\\(.*sha1"
    description: |
      MD5 和 SHA1 已不再安全：
      - MD5 存在已知碰撞攻击
      - SHA1 已被证明可实际碰撞
      不应用于密码存储或安全签名。
    fix_suggestion: |
      1. 密码存储使用 bcrypt/argon2/scrypt
      2. 签名/完整性校验使用 SHA-256 或更强
    cwe_ids: ["CWE-327", "CWE-328"]
    owasp_ids: ["A02:2021"]
    tags: [crypto, weak_hash]

  - id: py-crypto-weak-random
    name: 不安全随机数
    rule_type: pattern
    category: crypto
    risk_level: medium
    languages: [python]
    patterns:
      - random.random
      - random.randint
      - random.choice
      - random.randrange
      - random.sample
    description: |
      random 模块使用 Mersenne Twister 算法，可预测，
      不应用于安全目的（令牌、验证码、密钥等）。
    fix_suggestion: |
      使用 secrets 模块：
      - secrets.token_hex(32) 生成令牌
      - secrets.randbelow(n) 生成随机数
      - secrets.choice(alphabet) 安全选择
    cwe_ids: ["CWE-330", "CWE-338"]
    tags: [crypto, random]

  - id: py-crypto-weak-cipher
    name: 弱加密算法
    rule_type: pattern
    category: crypto
    risk_level: high
    languages: [python]
    patterns:
      - DES.new
      - DES3.new
      - RC4.new
      - RC2.new
      - Blowfish.new
      - ARC4.new
      - "regex:MODE_ECB"
    description: |
      DES/3DES/RC4/RC2 等算法已不安全：
      - DES 密钥太短（56位）
      - RC4 存在严重偏差漏洞
      - ECB 模式不隐藏数据模式
    fix_suggestion: |
      使用 AES-256-GCM 或 ChaCha20-Poly1305
    cwe_ids: ["CWE-327"]
    tags: [crypto, weak_cipher]

  - id: py-crypto-weak-ssl
    name: 不安全的 SSL/TLS 配置
    rule_type: pattern
    category: crypto
    risk_level: critical
    languages: [python]
    patterns:
