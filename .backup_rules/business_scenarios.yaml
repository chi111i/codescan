# 业务逻辑场景规则 - 用于检测逻辑漏洞
# 每个场景包含：关键词识别、必查checklist、LLM提示词模板

scenarios:
  # ============ 资金/交易相关 ============
  - id: SCENARIO-BALANCE-TRANSFER
    name: 余额转账
    category: financial
    risk_level: critical
    description: 用户间余额转账接口，需要严格校验权限和金额

    # 场景识别规则
    identification:
      keywords:
        - transfer
        - withdraw
        - deposit
        - balance
        - wallet
        - 转账
        - 提现
        - 充值
      function_patterns:
        - "transfer.*balance"
        - "send.*money"
        - "withdraw.*fund"
        - "deposit.*amount"
      parameter_patterns:
        - source_user|from_user|sender
        - target_user|to_user|receiver|recipient
        - amount|money|value|sum

    # 必查清单
    checklist:
      - id: CHK-001
        name: 转出账户所有权验证
        description: 检查转出账户是否属于当前登录用户
        severity: critical
        check_patterns:
          - "current_user.*==.*source"
          - "request.user.*==.*from_user"
          - "session.*user.*==.*sender"
        anti_patterns:
          - "source_user.*=.*request"
          - "from_user.*=.*params"

      - id: CHK-002
        name: 金额服务端校验
        description: 金额必须在服务端重新计算/验证，不能直接信任客户端
        severity: critical
        check_patterns:
          - "balance.*>=.*amount"
          - "check.*sufficient"
          - "validate.*amount"
        anti_patterns:
          - "amount.*=.*request.body"
          - "amount.*=.*req.params"

      - id: CHK-003
        name: 负数/零值检查
        description: 防止通过负数或零值绕过逻辑
        severity: high
        check_patterns:
          - "amount.*>.*0"
          - "if.*amount.*<=.*0"
          - "validate.*positive"

      - id: CHK-004
        name: 事务原子性
        description: 转账操作需要在事务中完成，防止中间状态
        severity: high
        check_patterns:
          - "transaction"
          - "atomic"
          - "@transaction"
          - "BEGIN.*COMMIT"
          - "with.*session"

      - id: CHK-005
        name: 并发控制
        description: 防止并发请求导致的超额转账
        severity: high
        check_patterns:
          - "lock"
          - "FOR UPDATE"
          - "select_for_update"
          - "mutex"
          - "semaphore"

      - id: CHK-006
        name: 频率限制
        description: 对转账操作进行频率限制
        severity: medium
        check_patterns:
          - "rate_limit"
          - "throttle"
          - "cooldown"

    # LLM 分析提示词模板
    llm_prompt_template: |
      你正在审计一个余额转账功能。请重点检查以下安全问题：

      ## 必查项
      1. **账户所有权验证**：转出账户是否验证属于当前登录用户？能否通过修改source_user参数转走他人资金？
      2. **金额校验**：金额是从服务端获取还是直接信任客户端？是否检查了负数/零值？
      3. **余额检查**：是否在扣款前验证余额充足？验证和扣款是否在同一事务中？
      4. **并发安全**：是否使用了锁或事务隔离级别防止并发超额转账？
      5. **审计日志**：是否记录了完整的转账记录？

      ## 常见攻击场景
      - 修改 source_user 参数实现转走他人资金
      - 传入负数金额实现反向转账
      - 并发请求导致余额变为负数
      - 跳过某些验证步骤直接调用内部接口

      请分析代码是否存在上述问题，并给出具体的漏洞位置和修复建议。

  - id: SCENARIO-PAYMENT-CALLBACK
    name: 支付回调
    category: financial
    risk_level: critical
    description: 支付平台回调接口，需要严格验证签名和状态

    identification:
      keywords:
        - callback
        - notify
        - webhook
        - payment.*result
        - pay.*callback
        - 回调
        - 通知
      function_patterns:
        - "payment.*callback"
        - "pay.*notify"
        - "order.*callback"
        - "webhook.*handler"
      decorator_patterns:
        - "@.*callback"
        - "@.*webhook"
        - "@.*notify"

    checklist:
      - id: CHK-011
        name: 签名验证
        description: 必须验证支付平台的签名，防止伪造回调
        severity: critical
        check_patterns:
          - "verify.*sign"
          - "check.*signature"
          - "validate.*signature"
          - "hmac"
          - "md5.*sign"

      - id: CHK-012
        name: 订单状态检查
        description: 处理前检查订单当前状态，防止重复处理
        severity: critical
        check_patterns:
          - "order.status.*==.*PENDING"
          - "if.*status.*!=.*PAID"
          - "check.*order.*status"

      - id: CHK-013
        name: 金额核对
        description: 回调金额需要与订单金额核对
        severity: critical
        check_patterns:
          - "callback.*amount.*==.*order.*amount"
          - "verify.*amount"
          - "amount.*match"

      - id: CHK-014
        name: 幂等性处理
        description: 同一回调多次请求应该只处理一次
        severity: high
        check_patterns:
          - "idempotent"
          - "processed.*return"
          - "if.*already.*paid"
          - "duplicate.*check"

      - id: CHK-015
        name: 来源IP验证
        description: 可选，验证回调来源IP是否为支付平台
        severity: medium
        check_patterns:
          - "whitelist.*ip"
          - "allowed.*ips"
          - "verify.*source"

    llm_prompt_template: |
      你正在审计一个支付回调处理函数。请重点检查以下安全问题：

      ## 必查项
      1. **签名验证**：是否验证了支付平台的签名？签名算法是否正确？
      2. **订单状态**：是否检查订单当前状态？能否重复触发回调修改已完成订单？
      3. **金额核对**：回调中的金额是否与订单原始金额进行了比对？
      4. **幂等处理**：多次相同回调是否会导致重复发货/充值？
      5. **异常处理**：签名失败或金额不匹配时的处理是否安全？

      ## 常见攻击场景
      - 伪造支付成功回调（未验证签名）
      - 篡改回调金额（支付1分获得100元商品）
      - 重放旧的成功回调
      - 利用异常处理逻辑绕过检查

      请分析代码是否存在上述问题，并给出具体的漏洞位置和修复建议。

  - id: SCENARIO-ORDER-OPERATION
    name: 订单操作
    category: financial
    risk_level: high
    description: 订单创建、修改、取消等操作

    identification:
      keywords:
        - order
        - checkout
        - cart
        - purchase
        - 订单
        - 购物车
        - 结算
      function_patterns:
        - "create.*order"
        - "update.*order"
        - "cancel.*order"
        - "checkout"
        - "place.*order"
      parameter_patterns:
        - "order_id|orderId"
        - "price|amount|total"
        - "quantity|qty|count"
        - "discount|coupon"

    checklist:
      - id: CHK-021
        name: 价格服务端计算
        description: 商品价格必须从服务端获取，不能信任客户端
        severity: critical
        check_patterns:
          - "product.price"
          - "get.*price.*from.*db"
          - "price.*=.*Product.objects"

      - id: CHK-022
        name: 优惠券验证
        description: 优惠券需要验证有效性、使用次数、适用范围
        severity: high
        check_patterns:
          - "coupon.*valid"
          - "coupon.*used"
          - "check.*coupon"
          - "validate.*discount"

      - id: CHK-023
        name: 库存检查
        description: 下单前检查库存，防止超卖
        severity: high
        check_patterns:
          - "stock.*>=.*quantity"
          - "check.*inventory"
          - "available.*stock"

      - id: CHK-024
        name: 订单所有权
        description: 修改/取消订单时验证订单属于当前用户
        severity: critical
        check_patterns:
          - "order.user.*==.*current_user"
          - "order.user_id.*==.*request.user"

    llm_prompt_template: |
      你正在审计订单相关操作。请重点检查以下安全问题：

      ## 必查项
      1. **价格篡改**：商品价格是从数据库获取还是信任客户端传入？
      2. **数量篡改**：商品数量是否有上下限检查？能否传入负数？
      3. **优惠滥用**：优惠券是否可以重复使用？是否验证适用范围？
      4. **订单归属**：操作订单时是否验证订单属于当前用户？
      5. **状态流转**：订单状态变更是否合法（如已支付订单不能修改）？

      ## 常见攻击场景
      - 修改前端价格参数实现低价购买
      - 修改数量为负数实现反向扣款
      - 重复使用同一优惠券
      - 修改order_id操作他人订单
      - 在特定状态下篡改订单内容

  # ============ 认证/账户相关 ============
  - id: SCENARIO-PASSWORD-RESET
    name: 密码重置
    category: authentication
    risk_level: critical
    description: 密码重置/找回密码功能

    identification:
      keywords:
        - password.*reset
        - forgot.*password
        - reset.*token
        - 重置密码
        - 找回密码
        - 忘记密码
      function_patterns:
        - "reset.*password"
        - "forgot.*password"
        - "recover.*account"
        - "send.*reset.*link"

    checklist:
      - id: CHK-031
        name: Token随机性
        description: 重置Token必须使用密码学安全的随机数
        severity: critical
        check_patterns:
          - "secrets.token"
          - "crypto.randomBytes"
          - "SecureRandom"
          - "uuid4"

      - id: CHK-032
        name: Token有效期
        description: 重置Token必须有合理的过期时间
        severity: high
        check_patterns:
          - "expire"
          - "valid_until"
          - "timeout"
          - "ttl"

      - id: CHK-033
        name: Token单次使用
        description: Token使用后必须立即失效
        severity: critical
        check_patterns:
          - "delete.*token"
          - "invalidate.*token"
          - "token.*used.*=.*True"

      - id: CHK-034
        name: 用户枚举防护
        description: 无论用户是否存在，返回相同响应
        severity: medium
        check_patterns:
          - "same.*response"
          - "generic.*message"

      - id: CHK-035
        name: 频率限制
        description: 限制重置请求频率，防止暴力破解
        severity: high
        check_patterns:
          - "rate_limit"
          - "throttle"
          - "cooldown"
          - "max.*attempts"

    llm_prompt_template: |
      你正在审计密码重置功能。请重点检查以下安全问题：

      ## 必查项
      1. **Token安全性**：重置Token是否使用安全随机数生成？长度是否足够？
      2. **Token有效期**：Token是否有过期时间？过期时间是否合理（建议<24小时）？
      3. **一次性使用**：Token使用后是否立即失效？能否重复使用同一Token？
      4. **用户枚举**：能否通过响应差异判断用户是否存在？
      5. **频率限制**：是否限制了重置请求的频率？

      ## 常见攻击场景
      - Token可预测导致任意用户密码重置
      - Token长期有效或可重复使用
      - 通过响应差异枚举有效用户
      - 无频率限制导致暴力破解Token

  - id: SCENARIO-ACCOUNT-BINDING
    name: 账户绑定变更
    category: authentication
    risk_level: critical
    description: 邮箱、手机号、第三方账号绑定/解绑

    identification:
      keywords:
        - bind.*email
        - bind.*phone
        - change.*email
        - change.*phone
        - unbind
        - 绑定
        - 换绑
        - 解绑
      function_patterns:
        - "bind.*email"
        - "bind.*phone"
        - "update.*email"
        - "update.*phone"
        - "link.*account"
        - "unlink.*account"

    checklist:
      - id: CHK-041
        name: 原凭证验证
        description: 变更前必须验证原邮箱/手机的验证码或密码
        severity: critical
        check_patterns:
          - "verify.*old"
          - "verify.*current"
          - "check.*password"
          - "validate.*code"

      - id: CHK-042
        name: 新凭证验证
        description: 必须验证新邮箱/手机的所有权
        severity: critical
        check_patterns:
          - "verify.*new"
          - "send.*code.*new"
          - "confirm.*email"

      - id: CHK-043
        name: 验证码安全
        description: 验证码需要有效期、长度、尝试次数限制
        severity: high
        check_patterns:
          - "code.*expire"
          - "max.*attempts"
          - "code.*length.*>=.*6"

      - id: CHK-044
        name: 操作通知
        description: 变更后通知原邮箱/手机
        severity: medium
        check_patterns:
          - "notify.*old"
          - "send.*alert"
          - "email.*changed.*notification"

    llm_prompt_template: |
      你正在审计账户绑定变更功能。请重点检查以下安全问题：

      ## 必查项
      1. **原凭证验证**：变更前是否验证了当前密码或原邮箱/手机验证码？
      2. **新凭证验证**：是否验证了新邮箱/手机的所有权（发送验证码）？
      3. **验证码安全**：验证码是否有有效期？尝试次数限制？
      4. **操作记录**：是否记录了变更操作？是否通知了用户？
      5. **并发安全**：能否通过并发请求绕过验证？

      ## 常见攻击场景
      - 未验证原凭证，任意绑定新邮箱/手机
      - 验证码可暴力破解
      - 利用条件竞争绕过验证
      - 验证码发送无频率限制导致轰炸

  # ============ 权限控制相关 ============
  - id: SCENARIO-RESOURCE-ACCESS
    name: 资源访问控制
    category: authorization
    risk_level: high
    description: 用户资源的增删改查权限控制

    identification:
      keywords:
        - get.*by.*id
        - find.*by.*id
        - delete
        - update
        - edit
      function_patterns:
        - "get.*user.*id"
        - "delete.*resource"
        - "update.*record"
      parameter_patterns:
        - "user_id|userId"
        - "resource_id|resourceId"
        - "id"

    checklist:
      - id: CHK-051
        name: 资源所有权验证
        description: 访问资源前验证资源属于当前用户
        severity: critical
        check_patterns:
          - "resource.user.*==.*current_user"
          - "resource.owner.*==.*request.user"
          - "belongs_to.*user"

      - id: CHK-052
        name: 租户隔离
        description: 多租户系统中验证租户边界
        severity: critical
        check_patterns:
          - "tenant_id.*==.*current_tenant"
          - "organization.*==.*user.org"

      - id: CHK-053
        name: 批量操作验证
        description: 批量操作时逐一验证每个资源的权限
        severity: high
        check_patterns:
          - "for.*id.*in.*ids.*check"
          - "all.*belong.*to.*user"

      - id: CHK-054
        name: 列表接口过滤
        description: 列表接口只返回当前用户有权访问的数据
        severity: high
        check_patterns:
          - "filter.*user.*=="
          - "where.*user_id.*="
          - "queryset.*filter"

    llm_prompt_template: |
      你正在审计资源访问控制。请重点检查以下安全问题：

      ## 必查项
      1. **IDOR漏洞**：是否验证了资源属于当前用户？能否通过修改ID访问他人资源？
      2. **租户隔离**：多租户系统中是否正确隔离了不同租户的数据？
      3. **批量操作**：批量删除/更新时是否逐一验证了每个资源的权限？
      4. **列表泄露**：列表接口是否可能泄露其他用户的数据？
      5. **隐式授权**：是否存在通过关联关系间接访问未授权资源的情况？

      ## 常见攻击场景
      - 修改URL/参数中的ID访问他人数据
      - 批量操作时混入他人资源ID
      - 通过搜索/过滤接口枚举数据
      - 利用关联查询访问未授权数据

  - id: SCENARIO-ADMIN-OPERATION
    name: 管理员操作
    category: authorization
    risk_level: critical
    description: 管理后台的敏感操作

    identification:
      keywords:
        - admin
        - manage
        - backend
        - dashboard
        - 管理
        - 后台
      function_patterns:
        - "admin.*"
        - "manage.*"
        - "backend.*"
      decorator_patterns:
        - "@admin_required"
        - "@staff_member_required"
        - "@permission_required"

    checklist:
      - id: CHK-061
        name: 权限验证
        description: 管理接口必须验证管理员权限
        severity: critical
        check_patterns:
          - "is_admin"
          - "is_staff"
          - "has_permission"
          - "@admin_required"

      - id: CHK-062
        name: 操作审计
        description: 管理操作需要记录完整审计日志
        severity: high
        check_patterns:
          - "audit_log"
          - "admin_log"
          - "log.*action"

      - id: CHK-063
        name: 二次验证
        description: 高危操作需要二次验证
        severity: high
        check_patterns:
          - "confirm.*password"
          - "verify.*otp"
          - "two_factor"

      - id: CHK-064
        name: 批量操作限制
        description: 限制批量操作的数量和范围
        severity: medium
        check_patterns:
          - "max.*batch"
          - "limit.*count"

    llm_prompt_template: |
      你正在审计管理员操作接口。请重点检查以下安全问题：

      ## 必查项
      1. **权限验证**：是否正确验证了管理员身份？能否绕过权限检查？
      2. **权限粒度**：不同级别管理员的权限是否正确区分？
      3. **操作审计**：敏感操作是否记录了完整的审计日志？
      4. **二次验证**：高危操作（如删除用户、修改配置）是否需要二次确认？
      5. **越权风险**：普通管理员能否执行超级管理员的操作？

      ## 常见攻击场景
      - 权限检查可被绕过
      - 低权限管理员执行高权限操作
      - 缺少审计日志导致无法追溯
      - 批量操作导致大规模数据泄露/损坏

# ============ 通用检查规则 ============
common_checks:
  - id: COMMON-001
    name: 身份认证
    description: 接口是否需要登录
    check_patterns:
      - "@login_required"
      - "@authenticated"
      - "jwt.*verify"
      - "session.*user"

  - id: COMMON-002
    name: 输入验证
    description: 用户输入是否经过验证
    check_patterns:
      - "validate"
      - "sanitize"
      - "Schema"
      - "Serializer"

  - id: COMMON-003
    name: 错误处理
    description: 错误信息是否泄露敏感数据
    anti_patterns:
      - "return.*str(e)"
      - "return.*exception"
      - "traceback"

  - id: COMMON-004
    name: 日志记录
    description: 敏感操作是否记录日志
    check_patterns:
      - "logger"
      - "logging"
      - "audit"

# ============ 严重性权重配置 ============
severity_weights:
  critical: 1.0
  high: 0.8
  medium: 0.5
  low: 0.2

# ============ 场景匹配阈值 ============
matching_thresholds:
  keyword_match_ratio: 0.3      # 关键词匹配比例阈值
  pattern_match_count: 2        # 模式匹配数量阈值
  confidence_threshold: 0.6     # 置信度阈值
